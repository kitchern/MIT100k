<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scriptify — Presentation Hub</title>
<style>
  :root{
    --bar-h: 56px;
    --ink: #0B1220;
    --muted: #64748B;
    --border: #E2E8F0;
    --accent: #0098B8;
    --bg: #FFFFFF;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;width:100%;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);}

  #switcher{
    position:fixed;
    top:0; left:0; right:0;
    height:var(--bar-h);
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 16px;
    background:#0B1220;
    border-bottom:1px solid #1E293B;
    z-index:10000;
    box-shadow:0 2px 12px rgba(0,0,0,0.25);
  }
  #switcher .brand{
    color:#fff;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.02em;
    margin-right:12px;
    white-space:nowrap;
    opacity:0.9;
  }
  #switcher .tabs{
    display:flex;
    gap:6px;
    flex:1;
    overflow-x:auto;
  }
  #switcher button{
    appearance:none;
    border:1px solid #2A3A50;
    background:#111827;
    color:#94A3B8;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.01em;
    padding:9px 16px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .18s ease;
  }
  #switcher button:hover{
    color:#E2E8F0;
    border-color:#0098B8;
  }
  #switcher button.active{
    background:#0098B8;
    border-color:#0098B8;
    color:#fff;
    box-shadow:0 0 0 3px rgba(0,152,184,0.25);
  }
  #switcher .now-viewing{
    color:#64748B;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    white-space:nowrap;
    margin-left:12px;
    display:none;
  }
  @media (min-width:780px){
    #switcher .now-viewing{ display:block; }
  }

  #frames{
    position:absolute;
    top:var(--bar-h);
    left:0; right:0; bottom:0;
  }
  #frames iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    display:none;
    background:#000;
  }
  #frames iframe.active{
    display:block;
  }

  /* corner badge repeated inside each iframe view so it's visible even if user scrolls/screenshots */
  #badge{
    position:fixed;
    top:calc(var(--bar-h) + 14px);
    right:16px;
    z-index:9999;
    background:rgba(11,18,32,0.85);
    color:#fff;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid rgba(0,152,184,0.5);
    pointer-events:none;
    backdrop-filter:blur(4px);
  }
</style>
</head>
<body>

  <div id="switcher">
    <div class="brand">Scriptify</div>
    <div class="tabs">
      <button data-target="frame-pseed" class="active">Scriptify PSEED</button>
      <button data-target="frame-100k">2026 MIT 100K</button>
      <button data-target="frame-sandbox">2026 MIT Sandbox</button>
      <button data-target="frame-deltav">2026 MIT Delta V Finalist</button>
    </div>
    <div class="now-viewing" id="nowViewing">Viewing: Scriptify PSEED</div>
  </div>

  <div id="badge">Scriptify PSEED</div>

  <div id="frames">
    <iframe id="frame-pseed" class="active" src="pseed.html" title="Scriptify PSEED"></iframe>
    <iframe id="frame-100k" src="mit100k.html" title="2026 MIT 100K"></iframe>
    <iframe id="frame-sandbox" src="sandbox.html" title="2026 MIT Sandbox"></iframe>
    <iframe id="frame-deltav" src="deltav.html" title="2026 MIT Delta V Finalist"></iframe>
  </div>

<script>
  const buttons = document.querySelectorAll('#switcher button');
  const frames = document.querySelectorAll('#frames iframe');
  const nowViewing = document.getElementById('nowViewing');
  const badge = document.getElementById('badge');

  function activate(targetId, label){
    frames.forEach(f => f.classList.toggle('active', f.id === targetId));
    buttons.forEach(b => b.classList.toggle('active', b.dataset.target === targetId));
    nowViewing.textContent = 'Viewing: ' + label;
    badge.textContent = label;
    try { history.replaceState(null, '', '#' + targetId); } catch(e) {}
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => activate(btn.dataset.target, btn.textContent));
  });

  // Deep-link support: open with #frame-sandbox etc.
  window.addEventListener('DOMContentLoaded', () => {
    const hash = window.location.hash.replace('#','');
    const match = document.getElementById(hash);
    if (match) {
      const btn = document.querySelector('button[data-target="' + hash + '"]');
      if (btn) activate(hash, btn.textContent);
    }
  });
</script>

</body>
</html>
